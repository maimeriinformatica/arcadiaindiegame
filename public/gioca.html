<!doctype html>
<html lang="it" data-nome="{{NOME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gioca – {{NOME}}</title>
<link rel="icon" href="/img/icona.svg">
<link rel="stylesheet" href="/css/stile.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  body { display: grid; grid-template-rows: auto 1fr; }
  .barra { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--notte); }
  .barra h1 { font-size: 1rem; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra a { color: var(--lavanda); text-decoration: none; font-weight: 600; padding: 6px 8px; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  .pad { color: var(--verde); font-size: .85rem; }
  body.intero .barra { display: none; }
  #condividi.nuovo { animation: pulsa 1s ease-in-out 3; }
  @keyframes pulsa { 50% { transform: scale(1.12); } }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--notte); color: #fff;
    padding: 12px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; z-index: 10; max-width: calc(100% - 32px); }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="barra">
  <a href="/" id="indietro">Esci</a>
  <h1 id="titolo">Caricamento…</h1>
  <span class="pad" id="pad" hidden>Gamepad collegato</span>
  <button class="btn piccolo" id="condividi" type="button">Condividi</button>
  <button class="btn piccolo secondario" id="intero">Schermo intero</button>
</div>
<div class="toast" id="toast" hidden role="status"><span id="toast-testo"></span>
  <button class="btn piccolo" id="toast-ok" type="button">Condividi</button>
  <button class="btn piccolo secondario" id="toast-no" type="button" aria-label="Chiudi">✕</button></div>
<iframe id="schermo" title="Gioco" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>
<script src="/js/comune.js"></script>
<script>
(async () => {
  const slug = parametro('slug');
  let d;
  try { d = await api(`/giochi/${encodeURIComponent(slug)}`); }
  catch { location.replace('/'); return; }
  if (!d.puoGiocare) { location.replace(`/abbonati.html?gioco=${encodeURIComponent(slug)}`); return; }
  const g = d.gioco;
  document.title = `${g.titolo} – ${NOME}`;
  $('#titolo').textContent = g.titolo;
  $('#indietro').href = `/gioco.html?slug=${encodeURIComponent(slug)}`;
  const f = $('#schermo');
  f.src = `/gioca/${encodeURIComponent(slug)}/`;
  f.addEventListener('load', () => f.focus());

  $('#intero').onclick = async () => {
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    } catch { document.body.classList.toggle('intero'); }
    f.focus();
  };
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('intero', !!document.fullscreenElement));
  // ---- Condivisione: link al gioco con il codice invito di chi gioca ----
  let link = `${location.origin}/gioco.html?slug=${encodeURIComponent(slug)}`;
  try { const inv = await api('/invita'); link += `&invito=${inv.codice}`; } catch { /* non loggato */ }
  let risultato = '';
  const condividi = async () => {
    const testo = risultato
      ? `${risultato}\n\nSfidami su ${g.titolo}:`
      : `Sto giocando a ${g.titolo} su ${NOME}. Prova anche tu:`;
    if (navigator.share) { try { await navigator.share({ title: g.titolo, text: testo, url: link }); } catch { /* annullato */ } return; }
    try { await navigator.clipboard.writeText(`${testo} ${link}`); mostraToast('Copiato! Incollalo dove vuoi.', false); }
    catch { window.open(`https://wa.me/?text=${encodeURIComponent(`${testo} ${link}`)}`, '_blank', 'noopener'); }
  };
  const mostraToast = (testo, conPulsante) => {
    $('#toast-testo').textContent = testo; $('#toast-ok').hidden = !conPulsante; $('#toast').hidden = false;
    clearTimeout(mostraToast.t); mostraToast.t = setTimeout(() => { $('#toast').hidden = true; }, 8000);
  };
  $('#condividi').onclick = condividi;
  $('#toast-ok').onclick = () => { $('#toast').hidden = true; condividi(); };
  $('#toast-no').onclick = () => { $('#toast').hidden = true; };
  // I giochi possono mandare il risultato a fine partita:
  // parent.postMessage({ arcadia: 'risultato', testo: 'Caveau aperto in 5 tentativi 🟡🟡⚪' }, '*')
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.source !== f.contentWindow) return;
    const d = e.data || {};
    if (d.arcadia !== 'risultato' || typeof d.testo !== 'string') return;
    risultato = d.testo.slice(0, 500);
    $('#condividi').classList.remove('nuovo'); void $('#condividi').offsetWidth; $('#condividi').classList.add('nuovo');
    mostraToast('Bella partita! Vuoi sfidare un amico?', true);
  });

  window.addEventListener('gamepadconnected', () => { $('#pad').hidden = false; });
  window.addEventListener('gamepaddisconnected', () => { $('#pad').hidden = navigator.getGamepads().some(Boolean) ? false : true; });
})();
</script>
</body>
</html>
